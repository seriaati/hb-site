faq:
  title: FAQ
  heading: Preguntas frecuentes
  description: "¿Tienes dudas que no aparecen aquí? Entra a nuestro servidor de Discord o consulta la documentación."
  free:
    question: "¿Hoyo Buddy es gratuito?"
    answer: |
      Sí. Todas las funciones principales son gratuitas y no hay anuncios.
      Si el bot te resulta útil, puedes <a href="https://link.seria.moe/donate" target="_blank" rel="noopener">patrocinar el proyecto</a> para ayudar a cubrir los costes de los servidores y el desarrollo continuo. Como agradecimiento, los patrocinadores reciben algunas funciones extra.
  games:
    question: "¿Con qué juegos y cuentas es compatible?"
    answer: |
      Hoyo Buddy es compatible con Genshin Impact, Honkai: Star Rail, Zenless Zone Zero, Honkai Impact 3rd y Tears of Themis, tanto en servidores globales (HoYoLAB) como de China continental (Miyoushe). Puedes vincular todas las cuentas que desees y alternar entre ellas con total comodidad.
      Las funciones disponibles pueden variar según la API de cada juego; consulta la <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">documentación</a> para ver la lista completa.
  where:
    question: "¿Es obligatorio invitarlo a un servidor para usarlo?"
    answer: |
      No es necesario. Hoyo Buddy es compatible con las aplicaciones instalables de usuario (User Apps) de Discord, lo que significa que puedes instalarlo directamente en tu cuenta personal de Discord.
      Una vez instalado, los comandos de barra funcionan dondequiera que hables: en mensajes directos privados, grupos de chat o servidores donde el bot no esté presente. Además, los administradores de servidores pueden invitarlo al servidor para que toda la comunidad lo disfrute.
  add_account:
    question: "¿Cómo vinculo mi cuenta del juego?"
    answer: |
      Ejecuta <code>/accounts</code> y selecciona «Añadir cuenta». La forma más rápida para cuentas globales es iniciar sesión con tu correo y contraseña de HoYoverse (los inicios de sesión de terceros como Google o Apple ID no son compatibles con la API web de HoYoLAB), lo que también permite el canje automático de códigos de regalo. También puedes iniciar sesión pegando las cookies de tu navegador.
      Las cuentas del servidor de China (Miyoushe) pueden iniciar sesión con código SMS o escaneando un código QR desde la app de Miyoushe.
  account_safe:
    question: "¿Es segura mi cuenta?"
    answer: |
      Tu contraseña nunca se guarda ni se almacena en nuestra base de datos. Al iniciar sesión con correo y contraseña, Hoyo Buddy solicita a HoYoLAB las cookies de autenticación de sesión e inmediatamente descarta tu contraseña de la memoria. Todas las cookies guardadas se cifran en reposo con el cifrado Fernet.
      Asimismo, las cookies web de HoYoLAB solo tienen permisos para leer datos públicos de la comunidad y notas diarias; no pueden entrar al cliente del juego, cambiar tu contraseña ni ver información sensible como tu correo o número de teléfono completos. Puedes desvincular tu cuenta y borrar todos tus datos en cualquier momento con <code>/accounts</code>. Lee más en la <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">guía de seguridad de cuentas</a> y la <a href="https://github.com/seriaati/hoyo-buddy/blob/main/PRIVACY.md" target="_blank" rel="noopener">política de privacidad</a>.
  ban:
    question: "¿Me pueden sancionar (banear) en el juego por usarlo?"
    answer: |
      No se ha reportado ni un solo caso de sanción en el juego por usar Hoyo Buddy. El bot interactúa exclusivamente con las API web públicas de HoYoLAB y Miyoushe, exactamente las mismas que visitas al consultar tus notas diarias en un navegador web o app móvil. En ningún momento modifica archivos del juego, no se inyecta en el proceso del juego ni lee la memoria de tu dispositivo.
      Aunque automatizar solicitudes web entra técnicamente en una zona gris de los términos de servicio de la web de HoYoLAB, cualquier hipotética sanción solo afectaría al acceso a la comunidad web de HoYoLAB, nunca a tus cuentas, personajes ni progreso dentro del juego. <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">Lee más en nuestro análisis de seguridad</a>.
  help:
    question: "¿Dónde puedo conseguir ayuda?"
    answer: |
      Consulta las guías de configuración y listas de comandos en la <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">documentación oficial</a>, o únete a nuestro <a href="https://dsc.gg/hoyo-buddy" target="_blank" rel="noopener">servidor de Discord</a> para resolver dudas con la comunidad y el desarrollador.
