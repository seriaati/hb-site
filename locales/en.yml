faq:
  title: FAQ
  heading: Frequently asked questions.
  description: Have a question not covered here? Join our Discord server or explore the documentation.
  free:
    question: Is Hoyo Buddy free?
    answer: |
      Yes. Every feature is completely free, with no ads, no paywalls, and no premium tiers.
      If you enjoy using the bot, you can <a href="https://link.seria.moe/donate" target="_blank" rel="noopener">sponsor the project</a>
      to help support server hosting and development.
  games:
    question: Which games and accounts does it work with?
    answer: |
      Hoyo Buddy supports Genshin Impact, Honkai: Star Rail, Zenless Zone Zero, Honkai Impact 3rd, and Tears of Themis
      across both global (HoYoLAB) and Chinese (Miyoushe) servers. You can link as many accounts as you want.
      Feature availability varies slightly by game based on API support; see the
      <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">Docs</a> for the full list.
  where:
    question: Do I need to add it to a server?
    answer: |
      No server required. Hoyo Buddy supports Discord's user app standard, so you can install it directly to your
      personal Discord account. Once installed, slash commands work anywhere you chat: in private DMs, group chats,
      and servers that don't have the bot. Server administrators can also add it to a server for their entire community.
  add_account:
    question: How do I add my game account?
    answer: |
      Run <code>/accounts</code> and choose Add account. The simplest method for global accounts is signing in with your
      HoYoverse email and password (third-party logins like Google or Apple ID are not supported by HoYoLAB's web API), which
      also enables automatic code redemption. Alternatively, you can log in by pasting your browser cookies.
      Miyoushe accounts can sign in using an SMS verification code or a QR code scan.
  account_safe:
    question: Is my account safe?
    answer: |
      Your password is never saved. When you sign in, Hoyo Buddy exchanges your credentials for the session cookies
      HoYoLAB requires and discards your password immediately. Stored cookies are encrypted at rest with Fernet encryption.
      HoYoLAB cookies only grant access to public web data; they cannot log into the game client, change your password,
      or reveal private info like your full email or phone number. You can delete your account data at any time with <code>/accounts</code>.
      Read more in our <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">Account Security guide</a> and
      <a href="https://github.com/seriaati/hoyo-buddy/blob/main/PRIVACY.md" target="_blank" rel="noopener">Privacy Policy</a>.
  ban:
    question: Can I get banned for using it?
    answer: |
      There have been zero reported game bans from using Hoyo Buddy. The bot interacts exclusively with HoYoLAB and Miyoushe's
      public web APIs, the same web endpoints accessed when viewing daily notes in a browser. It never modifies game files,
      injects into game processes, or reads game memory. While automating web requests technically falls outside HoYoLAB's web terms,
      any potential enforcement would only affect HoYoLAB community access, never your in-game accounts or progress.
      <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">Read more in our security guide</a>.
  help:
    question: Where can I get help?
    answer: |
      Check out the setup guides and command references in the <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">Docs</a>,
      or join our <a href="https://dsc.gg/hoyo-buddy" target="_blank" rel="noopener">Discord server</a> to ask questions and chat with the community.

