faq:
  title: FAQ
  heading: Perguntas frequentes
  description: Tem alguma dúvida que não foi respondida aqui? Entre no nosso servidor do Discord ou consulte a documentação.
  free:
    question: O Hoyo Buddy é gratuito?
    answer: |
      Sim. Todos os recursos são completamente gratuitos, sem anúncios, sem cobranças e sem assinaturas premium.
      Se você gosta do bot, pode <a href="https://link.seria.moe/donate" target="_blank" rel="noopener">apoiar o projeto</a> para ajudar com os custos de hospedagem e desenvolvimento contínuo.
  games:
    question: Com quais jogos e contas ele é compatível?
    answer: |
      O Hoyo Buddy é compatível com Genshin Impact, Honkai: Star Rail, Zenless Zone Zero, Honkai Impact 3rd e Tears of Themis, cobrindo servidores globais (HoYoLAB) e da China continental (Miyoushe). Você pode vincular quantas contas desejar e alternar entre elas facilmente.
      Alguns recursos variam conforme a API de cada jogo; confira a lista completa na <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">Documentação</a>.
  where:
    question: Eu preciso adicionar o bot a um servidor para usá-lo?
    answer: |
      Não é obrigatório. O Hoyo Buddy suporta o padrão de aplicativos de usuário (User Apps) do Discord, permitindo que você o instale diretamente na sua conta pessoal do Discord.
      Depois de instalado, os comandos de barra funcionam onde quer que você converse: em mensagens diretas privadas, grupos de amigos ou servidores onde o bot não foi adicionado. Administradores também podem adicioná-lo normalmente a servidores para toda a comunidade aproveitar.
  add_account:
    question: Como vinculo minha conta do jogo?
    answer: |
      Execute <code>/accounts</code> e escolha "Adicionar conta". A forma mais prática para contas globais é fazer login com seu e-mail e senha da HoYoverse (logins sociais como Google ou Apple ID não são aceitos pela API web da HoYoLAB), o que também habilita o resgate automático de códigos. Você também pode conectar colando os cookies do seu navegador.
      Contas do servidor chinês (Miyoushe) aceitam código SMS ou leitura de QR code pelo aplicativo da Miyoushe.
  account_safe:
    question: Minha conta está segura?
    answer: |
      Sua senha nunca é armazenada nem gravada em banco de dados. Quando você faz login com e-mail e senha, o Hoyo Buddy solicita à HoYoLAB apenas os cookies de autenticação da sessão e descarta sua senha da memória imediatamente. Os cookies salvos são criptografados com criptografia Fernet em repouso.
      Além disso, os cookies web da HoYoLAB só possuem permissão para consultar dados públicos da comunidade e notas do jogo; eles não conseguem entrar no cliente do jogo, não podem alterar sua senha e não revelam informações confidenciais como seu e-mail ou telefone completos. Você pode desvincular sua conta e apagar todos os dados a qualquer momento com <code>/accounts</code>. Saiba mais no <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">Guia de Segurança da Conta</a> e na <a href="https://github.com/seriaati/hoyo-buddy/blob/main/PRIVACY.md" target="_blank" rel="noopener">Política de Privacidade</a>.
  ban:
    question: Posso levar ban no jogo por usar o bot?
    answer: |
      Nunca houve sequer um caso relatado de banimento no jogo pelo uso do Hoyo Buddy. O bot interage exclusivamente com as APIs web públicas da HoYoLAB e da Miyoushe, as mesmas usadas quando você abre as notas diárias em um navegador ou app oficial. Ele não altera arquivos do jogo, não injeta processos e não lê a memória do seu computador ou celular.
      Embora automatizar requisições web tecnicamente caia em uma área cinzenta dos termos web da HoYoLAB, qualquer eventual medida se limitaria ao acesso à comunidade web da HoYoLAB, nunca afetando seu progresso, personagens ou itens dentro do jogo. <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">Leia mais sobre nossa análise de segurança</a>.
  help:
    question: Onde posso conseguir ajuda?
    answer: |
      Consulte os guias de configuração e lista de comandos na <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">Documentação</a>, ou entre no nosso <a href="https://dsc.gg/hoyo-buddy" target="_blank" rel="noopener">servidor no Discord</a> para tirar dúvidas com os membros da comunidade e o desenvolvedor.

