faq:
  title: FAQ
  heading: よくある質問
  description: 疑問や気になる点があれば、公式Discordサーバーやドキュメントもぜひご覧ください。
  free:
    question: Hoyo Buddy は本当に無料ですか？
    answer: |
      はい、すべての機能を完全無料でご利用いただけます。広告や有料プラン、機能制限などは一切ありません。
      もし気に入っていただけましたら、サーバー維持費や開発継続のための<a href="https://link.seria.moe/donate" target="_blank" rel="noopener">プロジェクト支援（寄付）</a>をご検討いただけると励みになります。
  games:
    question: どのゲームやアカウントに対応していますか？
    answer: |
      『原神』『崩壊：スターレイル』『ゼンレスゾーンゼロ』『崩壊3rd』『未定事件簿』に対応しており、グローバルサーバー（HoYoLAB）と中国本土サーバー（米游社）のどちらのアカウントも登録可能です。アカウント数に上限はなく、自由に追加・切り替えができます。
      ゲームごとに利用できる機能の詳細は、<a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">公式ドキュメント</a>をご確認ください。
  where:
    question: サーバーにボットを追加する必要がありますか？
    answer: |
      サーバーへの導入は必須ではありません。Hoyo BuddyはDiscordの「ユーザーインストール型アプリ（User App）」に対応しているため、個人のDiscordアカウントに直接追加できます。
      追加後は、個人のDMやグループチャット、ボットが導入されていない外部サーバーでも、そのままスラッシュコマンドを使用できます。もちろん、サーバー管理者がコミュニティ全体のためにサーバーへ導入することも可能です。
  add_account:
    question: ゲームアカウントはどのように登録しますか？
    answer: |
      <code>/accounts</code> を実行し、「アカウントを追加」を選択してください。グローバルアカウントの場合、HoYoverseのメールアドレスとパスワードでサインインするのが最も簡単です（GoogleやAppleなどのサードパーティ連携ログインはHoYoLABのWeb APIに対応していません）。このログイン方法を使うと、ギフトコードの自動交換も利用可能になります。また、ブラウザのCookieを貼り付けて登録することもできます。
      中国サーバー（米游社）の場合は、SMS認証コードまたは米游社アプリのQRコード読み取りに対応しています。
  account_safe:
    question: アカウントの安全性は確保されていますか？
    answer: |
      パスワードがサーバーに保存されることは一切ありません。メールアドレスとパスワードでサインインした際、Hoyo BuddyはHoYoLABとの認証を行ってセッションCookieを取得し、パスワードは即座にメモリ上から破棄されます。保存されるCookieもFernet方式によって暗号化されています。
      また、HoYoLABのWeb Cookieでアクセスできるのは公開されているコミュニティやWeb便箋データのみであり、ゲーム本体へのログイン、パスワードの変更、メールアドレスや電話番号といった個人情報の閲覧を行う権限は持ちません。登録したアカウント情報は <code>/accounts</code> からいつでも削除・完全消去できます。詳細は<a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">セキュリティガイド</a>および<a href="https://github.com/seriaati/hoyo-buddy/blob/main/PRIVACY.md" target="_blank" rel="noopener">プライバシーポリシー</a>をご覧ください。
  ban:
    question: ボットの使用によってゲームがBANされる心配はありますか？
    answer: |
      これまで、Hoyo Buddyの利用を原因とするゲームBANの報告は1件もありません。本ボットはHoYoLABおよび米游社が提供している公式Web APIのみを利用しており、ブラウザや公式スマホアプリでリアルタイムノートを見るのとまったく同じ仕組みで通信しています。ゲームクライアントのファイルを改変したり、メモリを読み取るような動作は一切行いません。
      Webリクエストの自動化は厳密にはHoYoLABのWeb利用規約上グレーゾーンですが、万一何か制限が生じたとしても対象はHoYoLABコミュニティのアクセス権に限られ、ゲーム本編の進行度やキャラクターデータに影響が及ぶことはありません。<a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">セキュリティに関する詳しい解説はこちら</a>。
  help:
    question: 使い方がわからない時はどうすればいいですか？
    answer: |
      <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">公式ドキュメント</a>に詳しい導入手順とコマンド一覧を掲載しています。解決しない場合は、公式<a href="https://dsc.gg/hoyo-buddy" target="_blank" rel="noopener">Discordサーバー</a>にてお気軽にご質問ください。

