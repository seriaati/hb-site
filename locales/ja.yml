  games:
    genshin: 天然樹脂の溢れを防ぎ、洗練されたビルドカードを生成。深境螺旋や幻想シアターの戦績確認、祈願履歴の管理まで幅広くサポート。
    hsr: 開拓力の上限アラート、キャラクター育成カードの作成、混沌の記憶・虚構叙事のクリア記録、跳躍履歴の追跡に対応。
