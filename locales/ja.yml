  title: Hoyo Buddy | HoYoverseプレイヤーのためのDiscordボット
  description: スタミナ溢れ防止リマインダー、毎日の自動チェックイン、コード一括交換、美麗なビルドカード生成。Discord上でHoYoverseの全ゲームとアカウントをスマートに管理。

