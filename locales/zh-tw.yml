faq:
  title: FAQ
  heading: 常見問題
  description: 還有其他疑問？歡迎加入我們的 Discord 伺服器或查閱官方文件。
  free:
    question: Hoyo Buddy 是免費的嗎？
    answer: |
      是的。所有功能皆完全免費，沒有廣告、沒有付費牆，也沒有任何會員特權制度。
      如果你覺得 Hoyo Buddy 對你有幫助，歡迎<a href="https://link.seria.moe/donate" target="_blank" rel="noopener">贊助本專案</a>，協助我們分擔伺服器租用與營運成本。
  games:
    question: 支援哪些遊戲與帳號？
    answer: |
      支援《原神》、《崩壞：星穹鐵道》、《絕區零》、《崩壞3rd》與《未定事件簿》，同時涵蓋國際服 (HoYoLAB) 與陸服 (米游社) 帳號。你可以無限制新增多個帳號並隨時切換。
      各遊戲支援的功能因官方 API 開放程度略有差異，詳情請參閱<a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">說明文件</a>。
  where:
    question: 我必須把它加入伺服器才能使用嗎？
    answer: |
      完全不需要。Hoyo Buddy 支援 Discord 使用者安裝應用程式 (User App) 標準，你可以直接將它安裝至你的個人 Discord 帳號。
      安裝後，無論是在私人私訊、群組通話，或是任何尚未加入該機器人的伺服器中，都能隨時隨地使用斜線指令。當然，伺服器管理員也能將它邀請至伺服器中供所有成員使用。
  add_account:
    question: 如何新增我的遊戲帳號？
    answer: |
      輸入 <code>/accounts</code> 並選擇「新增帳號」。國際服帳號最簡便的方式是使用 HoYoverse 信箱與密碼登入（HoYoLAB 網頁介面不支援 Google 或 Apple 等第三方登入授權），此方式亦能支援自動兌換禮物碼。此外，你也可以透過貼上瀏覽器 Cookie 完成登入。
      陸服（米游社）帳號則支援手機簡訊驗證碼或米游社 App 掃碼登入。
  account_safe:
    question: 我的帳號安全嗎？
    answer: |
      我們絕不會保存你的密碼。當你透過帳號密碼登入時，Hoyo Buddy 會直接向 HoYoLAB 換取驗證 Cookie，並在完成後立即捨棄密碼。所有儲存的 Cookie 皆經過 Fernet 演算法加密存儲。
      更重要的是，HoYoLAB Cookie 僅具有存取公開社群與便籤資料的權限，完全無法登入遊戲本體、修改帳號密碼，亦無法讀取完整的信箱或手機號碼等敏感個資。你隨時可以透過 <code>/accounts</code> 刪除帳號並清除所有相關資料。詳情請參閱<a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">帳號安全說明</a>與<a href="https://github.com/seriaati/hoyo-buddy/blob/main/PRIVACY.md" target="_blank" rel="noopener">隱私權政策</a>。
  ban:
    question: 使用 Hoyo Buddy 會導致遊戲被封號嗎？
    answer: |
      至今從未有任何因使用 Hoyo Buddy 而被遊戲封號的案例。機器人僅透過 HoYoLAB 與米游社的公開網頁 API 進行查詢，這與你在瀏覽器或手機 App 查看即時便籤的行為完全相同。它絕不修改遊戲檔案、不注入遊戲客戶端進程，也不會讀取遊戲記憶體。
      雖然自動化網頁請求在嚴格定義下可能違反 HoYoLAB 網頁服務條款，但任何潛在風險僅侷限於 HoYoLAB 社群網頁存取，絕不會影響你的遊戲客戶端進度與角色資產。<a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">閱讀完整的安全解析</a>。
  help:
    question: 遇到問題時該去哪裡尋求協助？
    answer: |
      請查閱<a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">官方說明文件</a>中的設定教學，或加入我們的 <a href="https://dsc.gg/hoyo-buddy" target="_blank" rel="noopener">Discord 伺服器</a>向社群成員與開發者尋求協助。

