    hsr: Meldingen wanneer je Trailblaze Power vol is, karakter-buildkaarten, overzichten van Memory of Chaos & Pure Fiction en je volledige warp-historie.
    zzz: Meldingen voor Battery Charge, herinneringen voor je kraskaart en videowinkel, resultaten van Shiyu Defense & Deadly Assault en inzicht in je signaalzoekgeschiedenis.
    honkai: Meldingen voor volle stamina, automatische dagelijkse check-in, score-overzichten voor Superstring Dimension & Memorial Arena en je complete Valkyrie-rooster.
    tot: Automatische dagelijkse check-ins zodat je nooit meer S-Chips of inlogbeloningen mist, direct geregeld voor al je gekoppelde accounts.

