faq:
  title: FAQ
  heading: Veelgestelde vragen
  description: Heb je een vraag die hier niet tussen staat? Kom gerust langs in onze Discord-server of bekijk de documentatie.
  free:
    question: Is Hoyo Buddy gratis?
    answer: |
      Ja. Elke functie is volledig gratis, zonder advertenties, zonder betaalmuren en zonder premium-abonnementen.
      Als je de bot met plezier gebruikt, kun je <a href="https://link.seria.moe/donate" target="_blank" rel="noopener">het project sponsoren</a> om serverkosten en verdere ontwikkeling te steunen.
  games:
    question: Welke games en accounts worden ondersteund?
    answer: |
      Genshin Impact, Honkai: Star Rail, Zenless Zone Zero, Honkai Impact 3rd en Tears of Themis, op zowel globale (HoYoLAB) als Chinese (Miyoushe) servers. Je kunt zoveel accounts koppelen als je wilt en eenvoudig wisselen.
      Sommige functies verschillen per game afhankelijk van de officiële API-ondersteuning; bekijk het volledige overzicht in de <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">documentatie</a>.
  where:
    question: Moet ik de bot toevoegen aan een Discord-server?
    answer: |
      Nee, dat is niet verplicht. Hoyo Buddy ondersteunt de User App-standaard van Discord, waardoor je de bot direct aan je persoonlijke Discord-account kunt koppelen.
      Zodra de bot is geïnstalleerd, werken de slash-commando's overal waar je chat: in privégesprekken (DM's), groepsgesprekken en servers waar de bot zelf niet is uitgenodigd. Serverbeheerders kunnen de bot uiteraard nog steeds aan hun server toevoegen voor de hele community.
  add_account:
    question: Hoe koppel ik mijn game-account?
    answer: |
      Voer <code>/accounts</code> uit en kies "Account toevoegen". Voor globale accounts is inloggen met je HoYoverse-e-mailadres en wachtwoord de snelste methode (inloggen via externe diensten zoals Google of Apple ID wordt niet ondersteund door de HoYoLAB-web-API). Dit maakt ook het automatisch inwisselen van codes mogelijk. Je kunt ook inloggen door je browser-cookies te plakken.
      Accounts op de Chinese server (Miyoushe) kunnen inloggen via een sms-verificatiecode of door een QR-code te scannen via de Miyoushe-app.
  account_safe:
    question: Is mijn account veilig?
    answer: |
      Je wachtwoord wordt nooit opgeslagen. Wanneer je inlogt met e-mailadres en wachtwoord, wisselt Hoyo Buddy deze direct uit bij HoYoLAB voor authenticatiecookies en wordt je wachtwoord onmiddellijk uit het geheugen gewist. Opgeslagen cookies worden versleuteld met Fernet-encryptie.
      Bovendien hebben HoYoLAB-webcookies uitsluitend leesrechten voor openbare community- en realtime-notities; ze kunnen niet inloggen op de gameclient zelf, kunnen je wachtwoord niet wijzigen en kunnen geen privégegevens zoals je volledige e-mailadres of telefoonnummer inzien. Je kunt een account en alle opgeslagen gegevens op elk gewenst moment wissen via <code>/accounts</code>. Lees meer in onze <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">accountbeveiligingsgids</a> en het <a href="https://github.com/seriaati/hoyo-buddy/blob/main/PRIVACY.md" target="_blank" rel="noopener">privacybeleid</a>.
  ban:
    question: Kan ik verbannen worden (in-game ban) door het gebruik van de bot?
    answer: |
      Er zijn nog nooit bans gemeld als gevolg van het gebruik van Hoyo Buddy. De bot communiceert uitsluitend met de officiële, openbare web-API's van HoYoLAB en Miyoushe, dezelfde webinterface die je gebruikt wanneer je notities bekijkt in een browser of de officiële app. De bot past geen gamebestanden aan, injecteert niet in gameprocessen en leest geen apparaatgeheugen uit.
      Hoewel het automatiseren van webrequests formeel onder de gebruiksvoorwaarden van de HoYoLAB-website valt, zou een eventuele sanctie zich beperken tot de HoYoLAB-website zelf en heeft dit nooit invloed op je in-game accounts, voortgang of personages. <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">Lees meer in onze beveiligingsanalyse</a>.
  help:
    question: Waar kan ik terecht voor hulp?
    answer: |
      Bekijk de handleidingen en commandolijsten op de <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">documentatiesite</a>, of kom gezellig langs in onze <a href="https://dsc.gg/hoyo-buddy" target="_blank" rel="noopener">Discord-server</a> om vragen te stellen aan de community en het team.

