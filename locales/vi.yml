faq:
  title: FAQ
  heading: Câu hỏi thường gặp
  description: Bạn có thắc mắc khác chưa được giải đáp? Hãy tham gia máy chủ Discord hoặc đọc tài liệu hướng dẫn.
  free:
    question: Hoyo Buddy có miễn phí không?
    answer: |
      Có. Toàn bộ tính năng đều hoàn toàn miễn phí, không có quảng cáo, không tính phí và không có gói thành viên cao cấp.
      Nếu bạn yêu thích dự án, bạn có thể <a href="https://link.seria.moe/donate" target="_blank" rel="noopener">tài trợ dự án</a> để hỗ trợ chi phí máy chủ và duy trì phát triển.
  games:
    question: Bot hỗ trợ những tựa game và tài khoản nào?
    answer: |
      Hoyo Buddy hỗ trợ Genshin Impact, Honkai: Star Rail, Zenless Zone Zero, Honkai Impact 3rd và Tears of Themis trên cả máy chủ quốc tế (HoYoLAB) và máy chủ Trung Quốc (Miyoushe). Bạn có thể thêm bao nhiêu tài khoản tùy thích.
      Một số tính năng có thể khác nhau tùy theo API của từng game; vui lòng xem danh sách chi tiết tại <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">Tài liệu hướng dẫn</a>.
  where:
    question: Tôi có bắt buộc phải mời bot vào máy chủ không?
    answer: |
      Không cần thiết. Hoyo Buddy hỗ trợ tiêu chuẩn ứng dụng người dùng (User App) của Discord, cho phép bạn cài đặt bot trực tiếp vào tài khoản Discord cá nhân.
      Sau khi cài đặt, bạn có thể sử dụng các lệnh gạch chéo ở bất kỳ đâu: trong tin nhắn riêng (DM), nhóm chat hoặc các máy chủ chưa thêm bot. Tất nhiên, quản trị viên máy chủ vẫn có thể mời bot vào máy chủ để toàn bộ thành viên cùng sử dụng.
  add_account:
    question: Làm thế nào để thêm tài khoản game của tôi?
    answer: |
      Chạy lệnh <code>/accounts</code> và chọn "Thêm tài khoản". Cách nhanh nhất cho tài khoản quốc tế là đăng nhập bằng email và mật khẩu tài khoản HoYoverse (đăng nhập bên thứ ba như Google hay Apple không được API HoYoLAB hỗ trợ), phương thức này cũng giúp bot tự động đổi giftcode cho bạn. Ngoài ra, bạn cũng có thể đăng nhập bằng cách dán Cookie trình duyệt.
      Tài khoản máy chủ Trung Quốc (Miyoushe) có thể đăng nhập bằng mã xác nhận gửi qua SMS hoặc quét mã QR từ ứng dụng Miyoushe.
  account_safe:
    question: Tài khoản của tôi có an toàn không?
    answer: |
      Mật khẩu của bạn không bao giờ được lưu trữ. Khi bạn đăng nhập bằng email và mật khẩu, Hoyo Buddy sẽ gửi thông tin đến HoYoLAB để nhận Cookie phiên đăng nhập và xóa mật khẩu khỏi bộ nhớ ngay lập tức. Cookie được lưu trữ luôn được mã hóa an toàn bằng thuật toán Fernet.
      Quan trọng hơn, Cookie web của HoYoLAB chỉ có quyền truy cập dữ liệu trang web công khai; nó hoàn toàn không thể đăng nhập vào game, không thể đổi mật khẩu và không thể xem thông tin nhạy cảm như email hay số điện thoại đầy đủ của bạn. Bạn có thể gỡ bỏ tài khoản và xóa sạch dữ liệu bất kỳ lúc nào bằng lệnh <code>/accounts</code>. Tìm hiểu thêm tại <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">An toàn tài khoản</a> và <a href="https://github.com/seriaati/hoyo-buddy/blob/main/PRIVACY.md" target="_blank" rel="noopener">Chính sách quyền riêng tư</a>.
  ban:
    question: Sử dụng bot có bị cấm (ban) tài khoản game không?
    answer: |
      Chưa từng có bất kỳ trường hợp nào bị cấm chơi game do sử dụng Hoyo Buddy. Bot chỉ tương tác trực tiếp với API web công khai của HoYoLAB và Miyoushe, tương tự như khi bạn xem ghi chú hàng ngày trên trình duyệt web. Bot hoàn toàn không can thiệp vào tệp cài đặt game, không đính kèm vào tiến trình và không đọc bộ nhớ của game.
      Dù việc gửi yêu cầu web tự động về mặt lý thuyết có thể không nằm trong điều khoản sử dụng web của HoYoLAB, nhưng nếu có bất kỳ biện pháp xử lý nào xảy ra thì nó cũng chỉ ảnh hưởng đến quyền truy cập diễn đàn HoYoLAB, tuyệt đối không ảnh hưởng đến tiến trình hay nhân vật trong game của bạn. <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">Đọc thêm phân tích an toàn</a>.
  help:
    question: Tôi có thể tìm sự trợ giúp ở đâu?
    answer: |
      Hãy xem hướng dẫn cài đặt và bảng lệnh chi tiết tại trang <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">Tài liệu</a>, hoặc tham gia <a href="https://dsc.gg/hoyo-buddy" target="_blank" rel="noopener">Máy chủ Discord</a> của chúng tôi để đặt câu hỏi và trao đổi cùng cộng đồng.

