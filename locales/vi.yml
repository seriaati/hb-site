commands:
  eyebrow: Lệnh
  title: Bộ lệnh thống nhất cho mọi tựa game.
  description: Không cần phải ghi nhớ cú pháp riêng biệt cho từng bot khác nhau. Chọn game và lệnh bên dưới để xem phản hồi thực tế từ Hoyo Buddy.
  game: Game
  list:
    notes: Theo dõi thời gian hồi Nhựa, thể lực và thám hiểm trong nháy mắt, cài đặt thông báo gửi qua DM trước khi chạm mốc.
    check_in: Nhận quà điểm danh HoYoLAB mỗi ngày ngay trên Discord chỉ bằng một nút bấm, xem chuỗi ngày điểm danh trong tháng.
    redeem: Nhập mã quà tặng từ buổi phát sóng trực tiếp hoặc bản cập nhật cho tất cả tài khoản cùng lúc, không cần mở trình duyệt.
    profile: Tạo thẻ chỉ số nhân vật đẹp mắt và tiện chia sẻ trực tiếp từ tủ trưng bày trong game của bạn.

