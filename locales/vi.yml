  description: "Nhắc nhở hồi thể lực, tự động điểm danh hàng ngày, đổi giftcode tức thì và tạo thẻ thông tin nhân vật tuyệt đẹp. Quản lý toàn bộ game và tài khoản HoYoverse ngay trong Discord."

