hero:
  pre: Người bạn đồng hành tại
  all: mọi tựa game HoYoverse
  summary: "Cảnh báo tràn thể lực, tự động điểm danh, nhận giftcode và tạo thẻ build nhân vật. Hỗ trợ Genshin, Star Rail, ZZZ cùng mọi tài khoản của bạn trên Discord."
  cta: Thêm vào Discord
  cta_note: Hoạt động trong mọi máy chủ và tin nhắn riêng (DM).
  overview: Xem tất cả game
  games:
    genshin: Không bao giờ lo tràn Nhựa, tạo thẻ build nhân vật từ tủ trưng bày, thống kê kết quả La Hoàn Thâm Cảnh & Nhà Hát Giả Tưởng, lưu trữ toàn bộ lịch sử Cầu Nguyện.
    hsr: Nhắc nhở khi Sức Mạnh Khai Phá chạm mốc tối đa, tạo thẻ nhân vật, phân tích kết quả Hồi Ức Hỗn Độn & Kể Chuyện Hư Cấu, theo dõi lịch sử Bước Nhảy.
    zzz: Cảnh báo hồi phục Điện Lượng, nhắc cào thẻ và nhận doanh thu Tiệm Băng Hình, kết quả Phòng Thủ Shiyu & Công Kích Nguy Hiểm, theo dõi lịch sử Dò Tín Hiệu.
    honkai: Thông báo hồi đầy Thể Lực, tự động điểm danh hàng ngày, cập nhật điểm Không Gian Siêu Huyền & Chiến Trường Ký Ức, quản lý toàn bộ Valkyrie của bạn.
    tot: Tự động điểm danh hàng ngày giúp bạn không bao giờ bỏ lỡ Chip S và phần thưởng, nhận quà cùng lúc cho tất cả tài khoản đã liên kết.

