faq:
  title: FAQ
  heading: 常见问题
  description: 还有其他疑问？欢迎加入我们的 Discord 服务器或查阅官方文档。
  free:
    question: Hoyo Buddy 是免费的吗？
    answer: |
      是的。所有功能完全免费，没有广告、没有付费墙，也没有任何会员特权制度。
      如果你觉得 Hoyo Buddy 对你有帮助，欢迎<a href="https://link.seria.moe/donate" target="_blank" rel="noopener">赞助本项目</a>，协助我们分担服务器托管与运维成本。
  games:
    question: 支持哪些游戏与账号？
    answer: |
      支持《原神》、《崩坏：星穹铁道》、《绝区零》、《崩坏3》与《未定事件簿》，同时兼容国际服 (HoYoLAB) 与国服 (米游社) 账号。你可以随意添加多个账号并随时切换。
      各游戏支持的功能因官方 API 开放程度略有差异，详情请参阅<a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">官方文档</a>。
  where:
    question: 我必须把它添加到服务器才能使用吗？
    answer: |
      完全不需要。Hoyo Buddy 支持 Discord 用户安装应用 (User App) 标准，你可以直接将其安装到个人 Discord 账号。
      安装后，无论是在私信、群聊，还是在任何尚未添加该机器人的服务器中，都能随时随地使用斜杠指令。当然，服务器管理员也可以将其邀请到服务器中供全员使用。
  add_account:
    question: 如何添加我的游戏账号？
    answer: |
      输入 <code>/accounts</code> 并选择“添加账号”。国际服账号最简便的方法是使用 HoYoverse 邮箱与密码登录（HoYoLAB 网页接口不支持 Google 或 Apple 等第三方登录授权），该方式还能自动兑换礼包码。此外，你也可以通过粘贴浏览器 Cookie 完成登录。
      国服（米游社）账号支持手机短信验证码或米游社 App 扫码登录。
  account_safe:
    question: 我的账号安全吗？
    answer: |
      我们绝不会保存你的密码。当你使用账号密码登录时，Hoyo Buddy 会直接向 HoYoLAB 换取会话 Cookie，并在完成后立即丢弃密码。所有存储的 Cookie 均经过 Fernet 算法加密保存。
      更重要的是，HoYoLAB Cookie 仅具有读取公开社区与便笺数据的权限，完全无法登录游戏本体、无法修改账号密码，也无法获取完整的邮箱或手机号等隐私信息。你随时可以通过 <code>/accounts</code> 删除账号并彻底抹除所有存储数据。详情请阅读<a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">账号安全指南</a>与<a href="https://github.com/seriaati/hoyo-buddy/blob/main/PRIVACY.md" target="_blank" rel="noopener">隐私政策</a>。
  ban:
    question: 使用 Hoyo Buddy 会导致游戏封号吗？
    answer: |
      至今从未有任何因使用 Hoyo Buddy 而被游戏封号的案例。机器人仅调用 HoYoLAB 与米游社的公开网页 API，这与你在浏览器或手机 App 中查看实时便笺的行为完全一致。它绝不修改游戏文件、不注入游戏进程，也不会读取游戏内存。
      虽然自动化网页请求在严格定义下可能不符合 HoYoLAB 网页服务条款，但任何潜在限制仅局限于 HoYoLAB 社区网页访问，绝不会波及你的游戏账号与游戏内进度。<a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">阅读完整的安全解析</a>。
  help:
    question: 遇到问题去哪里获取帮助？
    answer: |
      请查看<a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">官方文档</a>中的配置教程与指令说明，或加入我们的 <a href="https://dsc.gg/hoyo-buddy" target="_blank" rel="noopener">Discord 服务器</a>向社区玩家与开发者寻求帮助。

