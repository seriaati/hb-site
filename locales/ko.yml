  cta_note: 모든 서버와 개인 DM에서 바로 사용할 수 있습니다.
  overview: 전체 게임 보기
  games:
    genshin: 레진 낭비 걱정 없는 타이머 알림, 프로필 빌드 카드 제작, 나선 비경 및 현실 속 환상극 통계, 전체 기원 기록 열람.
    hsr: 개척력 최대치 알림, 캐릭터 빌드 카드, 혼돈의 기억 및 허구 이야기 클리어 기록 분석, 전체 워프 기록 추적.
    zzz: 배터리 충전 완료 알림, 매일 잊기 쉬운 복권과 비디오 상점 수익 알림, 시유 방위전 및 강습 방위전 결과, 변조 기록 추적.
