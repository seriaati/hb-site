faq:
  title: FAQ
  heading: 자주 묻는 질문
  description: 궁금한 점이 더 있으신가요? 공식 디스코드 서버에 방문하거나 가이드 문서를 확인해 보세요.
  free:
    question: Hoyo Buddy는 무료인가요?
    answer: |
      네, 모든 기능은 100% 무료입니다. 광고나 유료 결제 유도, 프리미엄 전용 기능 제한이 전혀 없습니다.
      봇이 마음에 드셨다면 서버 호스팅과 지속적인 개발을 지원하기 위해 <a href="https://link.seria.moe/donate" target="_blank" rel="noopener">프로젝트 후원</a>에 동참하실 수 있습니다.
  games:
    question: 지원하는 게임과 서버 계정은 무엇인가요?
    answer: |
      원신, 붕괴: 스타레일, 젠레스 존 제로, 붕괴3rd, 미결사건부를 지원하며, 글로벌 서버(HoYoLAB)와 중국 본토 서버(미요우서) 계정을 모두 등록할 수 있습니다. 계정 개수 제한 없이 여러 계정을 자유롭게 추가하고 전환할 수 있습니다.
      게임별 지원 기능은 API 제공 범위에 따라 다를 수 있으며, 자세한 내용은 <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">공식 가이드 문서</a>를 참고하세요.
  where:
    question: 디스코드 서버에 봇을 꼭 초대해야 하나요?
    answer: |
      서버 초대가 필수가 아닙니다! Hoyo Buddy는 디스코드 유저 앱(User App) 규격을 지원하므로 개인 디스코드 계정에 직접 설치할 수 있습니다.
      설치 후에는 개인 DM, 그룹 채팅방, 봇이 없는 외부 서버 등 어디서든 슬래시 명령어를 자유롭게 사용할 수 있습니다. 물론 서버 관리자가 커뮤니티 멤버들을 위해 서버에 직접 봇을 초대하는 것도 가능합니다.
  add_account:
    question: 게임 계정은 어떻게 연동하나요?
    answer: |
      <code>/accounts</code> 명령어를 실행한 뒤 <strong>계정 추가</strong>를 선택하세요. 글로벌 계정은 HoYoverse 이메일과 비밀번호로 로그인하는 방법이 가장 간편하며(Google, Apple 등의 소셜 로그인은 HoYoLAB 웹 API에서 지원하지 않음), 이 방식을 사용하면 리딤코드 자동 교환도 함께 활성화됩니다. 또는 웹 브라우저의 쿠키를 복사해 등록할 수도 있습니다.
      중국 서버(미요우서) 계정은 휴대폰 SMS 인증번호나 미요우서 앱 QR 코드 스캔으로 로그인할 수 있습니다.
  account_safe:
    question: 내 계정 정보는 안전하게 보호되나요?
    answer: |
      비밀번호는 데이터베이스에 절대 저장되지 않습니다. 이메일과 비밀번호로 로그인하면 Hoyo Buddy는 HoYoLAB과 통신하여 세션 인증 쿠키만을 발급받고 비밀번호는 즉시 메모리에서 영구 파기합니다. 보관되는 쿠키 또한 Fernet 알고리즘으로 강력하게 암호화되어 보관됩니다.
      또한 웹 쿠키로는 공개 커뮤니티 데이터와 실시간 메모 데이터만 조회할 수 있으며, 게임 클라이언트에 직접 접속하거나 비밀번호를 변경하거나 이메일·전화번호 전체를 열람하는 등의 행위가 원천적으로 불가능합니다. <code>/accounts</code> 명령어로 언제든 계정을 삭제하고 저장된 데이터를 즉시 초기화할 수 있습니다. 자세한 내용은 <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">계정 보안 가이드</a> 및 <a href="https://github.com/seriaati/hoyo-buddy/blob/main/PRIVACY.md" target="_blank" rel="noopener">개인정보 처리방침</a>을 확인하세요.
  ban:
    question: 봇 사용으로 인해 게임 계정이 제재(BAN)될 위험은 없나요?
    answer: |
      Hoyo Buddy 사용으로 인해 게임 정지를 당한 사례는 지금까지 단 한 건도 보고되지 않았습니다. 본 봇은 웹 브라우저나 공식 모바일 앱에서 실시간 메모를 열람할 때와 동일한 공식 웹 API만을 사용하며, 게임 파일을 변조하거나 게임 프로세스에 인젝션하거나 메모리를 조작하지 않습니다.
      웹 요청 자동화는 엄밀히 따지면 HoYoLAB 웹 이용약관상 주의 대상일 수 있으나, 만에 하나 제재가 발생하더라도 HoYoLAB 웹 커뮤니티 접근에 국한될 뿐 게임 내 캐릭터나 플레이 진행도에는 어떠한 영향도 미치지 않습니다. <a href="https://docs.hb.seria.moe/docs/Account-Security" target="_blank" rel="noopener">보안 분석 내용 자세히 보기</a>.
  help:
    question: 사용 중 문제가 생기면 어디에 문의해야 하나요?
    answer: |
      <a href="https://docs.hb.seria.moe" target="_blank" rel="noopener">공식 가이드 문서</a>에서 설정 방법과 명령어 안내를 확인하시거나, 공식 <a href="https://dsc.gg/hoyo-buddy" target="_blank" rel="noopener">디스코드 서버</a>에 참여하여 커뮤니티 멤버 및 개발자에게 편하게 질문해 주세요.

