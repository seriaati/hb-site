  title: Hoyo Buddy | 호요버스 게이머를 위한 디스코드 봇
  description: 레진 및 개척력 알림, 일일 출석체크 자동화, 리딤코드 즉시 교환, 한눈에 보는 캐릭터 빌드 카드까지. 디스코드에서 호요버스의 모든 게임과 계정을 손쉽게 관리하세요.

